<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Week at Northline | Choosing the Right Communication Medium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCF8F1; --cream:#F6EEE0; --gray:#EFE8DD; --gray-edge:#CABFB0;
  --ink:#312B26; --ink-soft:#6E635A;
  --accent:#B0635F; --accent-deep:#8C4A47;
  --blue:#E6EFF3; --blue-edge:#5A8499;
  --sage:#E9F1E5; --sage-edge:#5E7E54;
  --clay:#F6E9DA; --clay-edge:#A6743F;
  --blush:#FAECE9;
  --radius:18px;
  --shadow:0 18px 44px -30px rgba(49,43,38,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; padding:46px 20px 80px;
  background:
    radial-gradient(1100px 520px at 78% -8%, #F4E7DA 0%, rgba(244,231,218,0) 60%),
    radial-gradient(900px 480px at 6% 4%, #EAF0F2 0%, rgba(234,240,242,0) 55%),
    var(--cream);
  color:var(--ink);
  font-family:"Hanken Grotesk", system-ui, sans-serif;
  font-size:18px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:740px; margin:0 auto}
h1,h2,h3{font-family:"Fraunces", Georgia, serif; line-height:1.18; font-weight:600; letter-spacing:.1px}
h1{font-size:40px; margin:.1em 0 .25em}
h2{font-size:27px; margin:.2em 0 .4em}
h3{font-size:20px; margin:0 0 .35em}
p{margin:.55em 0}
b,strong{font-weight:700}
.kicker{font-size:12.5px; letter-spacing:2px; text-transform:uppercase; font-weight:700; color:var(--accent-deep)}

/* identity strip */
.who-strip{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; letter-spacing:.3px}
.who-strip b{color:var(--ink)}

/* progress + phase */
.progress{display:flex; align-items:center; gap:14px; margin-bottom:26px; flex-wrap:wrap}
.dots{display:flex; gap:8px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--gray-edge); opacity:.5; transition:.3s}
.dot.on{background:var(--accent); opacity:1; transform:scale(1.25)}
.dot.done{background:var(--accent); opacity:.7}
.step-label{font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.phase{font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; color:#fff; background:var(--accent); padding:4px 11px; border-radius:999px}
.phase.learn{background:var(--blue-edge)} .phase.practice{background:var(--accent)} .phase.check{background:var(--clay-edge)} .phase.toolkit{background:var(--sage-edge)}

.card{background:var(--paper); border-radius:var(--radius); padding:38px 36px; box-shadow:var(--shadow); border:1px solid #EBE2D4}
.situation-tag{display:inline-block; background:var(--gray); color:var(--ink-soft); font-size:13px; letter-spacing:.4px; font-weight:700; padding:6px 14px; border-radius:999px; margin-bottom:18px; text-transform:uppercase}

.msg-bubble{background:var(--gray); border-radius:14px; padding:14px 18px; margin:6px 0 18px; border-left:4px solid var(--gray-edge)}
.msg-bubble .who{font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:5px}
.msg-bubble .text{font-size:18px; font-style:italic}

.reply-bubble{background:#fff; border:1px solid #E4DACB; border-radius:14px; border-top-left-radius:4px; padding:14px 18px; margin:2px 0 14px; box-shadow:0 8px 18px -16px rgba(49,43,38,.6)}
.reply-bubble .who{font-size:12.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:5px}
.reply-bubble .text{font-size:17.5px; font-style:italic; color:var(--ink)}

.q-prompt{font-family:"Fraunces",serif; font-weight:600; font-size:20px; margin:18px 0 0; color:var(--ink)}

.options{display:flex; flex-direction:column; gap:14px; margin-top:22px}
.opt{position:relative; display:flex; gap:15px; align-items:flex-start; text-align:left; border:1.5px solid #E4DACB; border-radius:14px; padding:18px 20px; font-family:inherit; font-size:17px; line-height:1.55; color:var(--ink); cursor:pointer; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; width:100%}
.opt:hover,.opt:focus-visible{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 12px 26px -18px rgba(49,43,38,.6)}
.opt:focus-visible{outline:3px solid var(--blue-edge); outline-offset:3px}
.opt.a{background:#FAECE9} .opt.b{background:#E6EFF3} .opt.c{background:#E9F1E5} .opt.d{background:#F6E9DA}
.opt[disabled]{cursor:default; opacity:.55; transform:none; box-shadow:none}
.opt[disabled]:hover{border-color:#E4DACB; transform:none; box-shadow:none}
.opt.chosen{opacity:1; border-color:var(--accent); border-width:2px}
.opt-badge{flex-shrink:0; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:600; font-size:19px; color:#fff}
.opt-badge.a{background:#A85D5D} .opt-badge.b{background:#5A8499} .opt-badge.c{background:#5E7E54} .opt-badge.d{background:#A6743F}
.opt-text{flex:1; padding-top:3px}
.opt-viewed{display:inline-block; margin-top:9px; font-size:12px; letter-spacing:.6px; text-transform:uppercase; font-weight:700; color:var(--ink-soft)}

/* reaction blocks */
.block{border-radius:16px; padding:22px 24px; margin:0 0 16px; border-left:6px solid}
.block h3{margin:0 0 8px} .block p{margin:0}
.b-happened{background:var(--cream); border:1.5px solid #E4DACB; border-left-color:var(--gray-edge); border-left-width:6px}
.b-why{background:var(--blue); border-left-color:var(--blue-edge)}
.b-indicators{background:var(--paper); border:1.5px solid #EBE2D4; border-left-color:var(--gray-edge); border-left-width:6px}
.b-concept{background:var(--sage); border-left-color:var(--sage-edge)}
.b-warn{background:var(--blush); border-left-color:var(--accent)}
.b-clay{background:var(--clay); border-left-color:var(--clay-edge)}

.ind-grid{display:flex; flex-direction:column; gap:10px; margin-top:8px}
.ind{display:flex; flex-direction:column; gap:6px; padding:14px 16px; border-radius:12px; background:var(--cream); border:1px solid #E4DACB}
.ind-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.ind-name{font-weight:700; font-size:16px}
.ind-status{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; padding:4px 12px; border-radius:999px; letter-spacing:.3px}
.ind-status.strong{background:var(--sage); color:#3D5A38}
.ind-status.partial{background:var(--clay); color:#7A5234}
.ind-status.weak{background:var(--blush); color:#7A3F3F}
.ind-reason{font-size:15.5px; color:var(--ink-soft); line-height:1.55; margin:0}

.btn-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:18px}
.btn{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; border:none; font-family:inherit; font-weight:700; font-size:17px; letter-spacing:.3px; padding:15px 28px; border-radius:999px; cursor:pointer; transition:transform .16s ease, background .16s ease}
.btn:hover{background:var(--accent-deep); transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--blue-edge); outline-offset:3px}
.btn.ghost{background:transparent; color:var(--accent-deep); border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--blush)}
.btn[disabled]{opacity:.5; cursor:default; transform:none}
.center{text-align:center} .mini{font-size:15px; color:var(--ink-soft)}

/* learn-phase helpers */
.channel-list{background:var(--cream); border-radius:14px; padding:18px 22px; margin:6px 0 18px; border:1px solid #E4DACB}
.channel-list .row{padding:8px 0; font-size:16.5px; border-bottom:1px dashed #E4DACB; display:flex; gap:12px; align-items:baseline}
.channel-list .row:last-child{border-bottom:none}
.channel-list .row b{color:var(--accent-deep)}
.rank{flex-shrink:0; width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-size:15px; color:#fff; background:var(--ink-soft)}
.pair{display:flex; gap:14px; margin:6px 0 18px; flex-wrap:wrap}
.pair > div{flex:1; min-width:240px; border-radius:14px; padding:18px 20px}
.pair .rich{background:var(--blush); border:1px solid #EAD3CF}
.pair .lean{background:var(--blue); border:1px solid #D2E0E7}
.pair h3{margin-top:0}

/* your read */
.profile{background:var(--paper); border:1px solid #EBE2D4; border-left:6px solid var(--accent); border-radius:16px; padding:24px 26px; margin-bottom:18px}
.choice-row{display:flex; gap:13px; align-items:flex-start; background:var(--cream); border:1px solid #E4DACB; border-radius:13px; padding:14px 16px; margin-bottom:10px}
.choice-row .num{flex-shrink:0; width:30px; height:30px; border-radius:9px; background:var(--accent); color:#fff; font-family:"Fraunces",serif; font-weight:600; display:flex; align-items:center; justify-content:center}
.choice-row .num.clay{background:var(--clay-edge)}
.choice-row .sit{font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700; margin-bottom:3px}
.choice-row .pick{font-size:16px; color:var(--ink); line-height:1.5}
.choice-row .pick b{color:var(--accent-deep)}

.tool{background:var(--paper); border:1px solid #EBE2D4; border-left:6px solid var(--sage-edge); border-radius:16px; padding:20px 22px; margin-bottom:14px}
.tool h3{margin:0 0 6px}
.tool .example{font-size:15.5px; color:var(--ink-soft); margin-top:6px}
.callout{background:var(--clay); border-left:6px solid var(--clay-edge); border-radius:16px; padding:20px 24px; margin:22px 0}

/* sign in */
.field{margin:18px 0 6px}
.field label{display:block; font-weight:700; font-size:15px; letter-spacing:.3px; margin-bottom:8px}
.field input{width:100%; font-family:inherit; font-size:22px; letter-spacing:2px; padding:14px 16px; border:1.5px solid #CABFB0; border-radius:12px; background:#fff; color:var(--ink)}
.field input:focus{outline:3px solid var(--blue-edge); outline-offset:2px; border-color:var(--blue-edge)}
.field .hint{font-size:14.5px; color:var(--ink-soft); margin-top:6px}
.seg{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
.seg button{flex:1; min-width:180px; font-family:inherit; font-size:16.5px; font-weight:700; padding:16px 18px; border-radius:14px; border:1.5px solid #E4DACB; background:#fff; color:var(--ink); cursor:pointer; text-align:left; line-height:1.4}
.seg button small{display:block; font-weight:500; color:var(--ink-soft); font-size:14px}
.seg button.on{border-color:var(--accent); background:var(--blush); box-shadow:0 0 0 2px var(--accent) inset}
.err{color:#8C2F2B; font-weight:700; font-size:15px; margin-top:8px}
.privacy{font-size:15px; color:var(--ink-soft); background:var(--paper); border:1px dashed #CABFB0; border-radius:12px; padding:14px 16px; margin-top:20px}
.privacy b{color:var(--ink)}

/* score */
.score-hero{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:6px 0 10px}
.score-num{font-family:"Fraunces",serif; font-size:64px; font-weight:600; line-height:1; color:var(--accent-deep)}
.score-of{font-size:20px; color:var(--ink-soft)}
.status-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:16px; padding:14px 16px; border-radius:12px; margin-top:10px}
.status-line.ok{background:var(--sage); border:1px solid #CFE0C8}
.status-line.wait{background:var(--clay); border:1px solid #EAD6BC}
.status-line.bad{background:var(--blush); border:1px solid #EAD3CF}
.record-id{font-family:"Fraunces",serif; font-size:26px; letter-spacing:3px; font-weight:600; color:var(--ink)}

.screen{animation:rise .5s ease both}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.stagger>*{animation:rise .5s ease both}
.stagger>*:nth-child(2){animation-delay:.06s} .stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.18s} .stagger>*:nth-child(5){animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.screen,.stagger>*{animation:none}.opt{transition:none}}
@media (max-width:520px){body{padding:30px 14px 60px; font-size:17px} .card{padding:26px 22px} h1{font-size:32px} .score-num{font-size:52px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
/* =========================================================================
   YOUR WEEK AT NORTHLINE · Media Richness simulation · graded edition
   Learn (4 ideas) → Practice (5 moments, explore freely) → The Check (5 new
   moments, one answer each, scored) → Result (recorded for the instructor).
   Privacy: the page never sends a name, email, or NetID. The NetID is
   scrambled in this browser (SHA-256 with a public salt) before anything
   leaves the laptop; the collector scrambles it again with a private key.
   ========================================================================= */

const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbz8sy_FMZsIJuAOQOtbmRqBn-P03bvZCW-Dev7BEBSWBblCSi0RF1CMTMS39JCzWvTgOQ/exec",          // Google Apps Script web app URL (set at deploy time)
  SALT1: "northline-ctstate-2026",   // public salt, must match the instructor dashboard
  ACTIVITY: "NL1",                   // which activity this page records
  VERSION: "nl1-2026-09-02b",
  SECTIONS: {
    "13046": { label: "CRN 13046", sub: "In person · Mon/Wed 12:30" },
    "13901": { label: "CRN 13901", sub: "Live online · Mon/Wed 5:30" }
  },
  POINTS: { strong: 2, partial: 1, weak: 0 }
};

(function(){ try { const q = new URLSearchParams(location.search); if(q.get("test") === "1") CONFIG.ACTIVITY = CONFIG.ACTIVITY + "-TEST"; } catch(e){} })();
const TOTAL_LEARN = 4;
const TOTAL_PRACTICE = 5;
const TOTAL_CHECK = 5;
const STORE_KEY = "northline_" + CONFIG.ACTIVITY;

const state = {
  screen: "intro",      // intro | signin | learn | practice | read | checkintro | check | result
  section: null,
  netidTail: "",        // last two digits, shown for reassurance only
  h1: null,             // scrambled id (hex)
  startedAt: null,
  learnStep: 0,
  practiceStep: 0,
  picks: [null,null,null,null,null],          // final practice pick per scenario
  firstPicks: [null,null,null,null,null],     // first practice pick per scenario
  explored: [[],[],[],[],[]],                 // every option viewed per scenario
  checkStep: 0,
  checkOrder: null,                           // shuffled option order per check moment
  answers: [null,null,null,null,null],        // chosen option id per check moment
  submitted: null,                            // server response for the final submission
  submitError: null
};

const app = document.getElementById("app");

/* ---------- LEARN content (one idea per screen) ---------- */
const LEARN = [
  {
    tag:"The big idea",
    h:"Every message travels through a channel.",
    body:`A <b>communication channel</b> is simply the way a message gets from you to another person. Talking face to face is a channel. A phone call is a channel. So are email, a Teams chat, a voicemail, and a printed memo.<br><br>You make this choice all day without thinking about it. This week at Northline, we are going to slow it down and make the choice <b>on purpose</b>.`,
    extra:""
  },
  {
    tag:"Rich vs. lean",
    h:"Some channels carry more of you than others.",
    body:`Channels differ in how much human information they carry. We call this <b>richness</b>.`,
    extra:`<div class="pair">
      <div class="rich"><h3>Rich channels</h3><p>Carry many cues at once. Voice, tone, facial expression, body language, and <b>instant back and forth</b>. Best when a message is personal, emotional, or easy to misread.</p></div>
      <div class="lean"><h3>Lean channels</h3><p>Carry fewer cues. Mostly just the words. But they are fast, easy to share, and they <b>leave a record</b>. Best for simple facts, dates, and documentation.</p></div>
    </div>
    <p class="mini">Neither one is better. They are good at <b>different jobs</b>.</p>`
  },
  {
    tag:"The richness ladder",
    h:"Channels stack from richest to leanest.",
    body:`Here is roughly how everyday workplace channels line up, from the most human cues to the fewest.`,
    extra:`<div class="channel-list">
      <div class="row"><span class="rank">1</span><div><b>Face to face.</b> Every cue, instant feedback. The richest.</div></div>
      <div class="row"><span class="rank">2</span><div><b>Video call.</b> Faces and voice, nearly as rich.</div></div>
      <div class="row"><span class="rank">3</span><div><b>Phone call.</b> Voice and tone, no faces.</div></div>
      <div class="row"><span class="rank">4</span><div><b>Live chat / instant message.</b> Fast back and forth, but text only.</div></div>
      <div class="row"><span class="rank">5</span><div><b>Email.</b> Slower, one direction, but documented.</div></div>
      <div class="row"><span class="rank">6</span><div><b>Memo / posted notice.</b> Formal, one to many, leanest.</div></div>
    </div>`
  },
  {
    tag:"The real skill",
    h:"The goal is to match, not to maximize.",
    body:`Here is the part most people get wrong. They assume the <b>richest</b> channel is always the best one. It is not.<br><br>A face to face meeting to announce a room change wastes everyone's time. An email to end someone's job strips away every ounce of dignity. The skill is <b>fit</b>. You ask what the message needs, then you choose the channel that delivers it.`,
    extra:`<div class="callout"><p>Three questions do most of the work:<br><br><b>1. How personal or high stakes is this?</b> The more it touches someone's dignity, income, or feelings, the richer the channel.<br><b>2. How easy is it to misread?</b> The more ambiguous, the more you need tone and instant feedback.<br><b>3. Do I need a record?</b> If yes, written, often <b>paired</b> with a conversation.</p></div>
    <p>Five practice moments come next. Go with your gut and try every option you are curious about. <b>Practice is not scored.</b> The five moments of <b>The Check</b>, after practice, are.</p>`
  }
];

/* ---------- PRACTICE scenarios (explore freely, not scored) ---------- */
const SCENARIOS = [
  {
    tag:"Monday · 9:14 AM",
    setup:`Your teammate <b>Dana</b> has spent six weeks building a campaign. Leadership just killed it for budget reasons. She does not know yet. You do. She sits one row over.`,
    who:"The situation",
    q:"How do you tell Dana the campaign is cancelled?",
    options:{
      a:{label:"Walk over and tell her in person, privately, before the news spreads.",
         reply:`Dana's face falls, then she takes a breath. "Okay. Thank you for telling me yourself. Can you walk me through why?" You can.`,
         who:"Dana",
         happened:`You chose the richest channel for a message that was personal and disappointing. Dana could read your tone, ask questions on the spot, and keep her dignity.`,
         why:`High stakes and emotional messages need <b>full cues and instant feedback</b>. Face to face gave her both, plus the respect of hearing it from a person rather than a screen.`,
         concept:`This is the textbook case for a <b>rich channel</b>. The harder the news, the more human the delivery should be.`,
         inds:[
           {n:"Right richness for the weight", s:"strong", r:"Personal, disappointing news got your richest channel."},
           {n:"Room to ask questions", s:"strong", r:"Dana could respond and ask why in the moment."},
           {n:"Respect & dignity", s:"strong", r:"She heard it from a person, in private, first."},
           {n:"Timing", s:"strong", r:"You reached her before rumors did."}
         ]},
      b:{label:"Send her an email laying out the decision and the reasons.",
         reply:`An hour passes with no reply. Then Dana appears at your desk, quiet and tight. "I had to read that in an email? Sitting ten feet away from you?"`,
         who:"Dana",
         happened:`The decision was accurate, but the channel was far too lean for the weight of the message. Email gave her no tone, no chance to respond, and no sign that you saw her as a person.`,
         why:`Email is one directional and stripped of cues. For news that touches someone's work and feelings, that absence reads as <b>cold or even cowardly</b>, even when you did not mean it that way.`,
         concept:`This echoes the real layoff cases. Email is fine for the record. Used <b>alone</b> for life sized news, it wounds.`,
         inds:[
           {n:"Right richness for the weight", s:"weak", r:"A lean channel carried a heavy, personal message."},
           {n:"Room to ask questions", s:"weak", r:"One direction. She had to come find you."},
           {n:"Respect & dignity", s:"weak", r:"Reading it from a desk away felt impersonal."},
           {n:"Timing", s:"partial", r:"Fast to send, but she sat with it alone first."}
         ]},
      c:{label:"Send a quick Teams chat: \"hey, heads up, the campaign got cut. sorry :(\"",
         reply:`Three dots appear, stop, appear again. "Wait, cut how? Like paused or gone? Who decided?" The questions pile up faster than you can type.`,
         who:"Dana",
         happened:`A casual chat made a serious message feel tossed off, and text could not carry your tone. Now you are having the hard conversation anyway, but typed, slowly, and with confusion in between.`,
         why:`Instant message is great for quick logistics. For something ambiguous and emotional, it is <b>too thin</b>. The cues that would have reassured her are missing.`,
         concept:`Lean channels make heavy news feel smaller than it is, and force the real conversation to happen later anyway.`,
         inds:[
           {n:"Right richness for the weight", s:"weak", r:"A throwaway tone for a serious message."},
           {n:"Room to ask questions", s:"partial", r:"She can ask, but slowly and without your tone."},
           {n:"Respect & dignity", s:"weak", r:"\"sorry :(\" undersells the moment."},
           {n:"Timing", s:"partial", r:"Fast, but it opens a long typed back and forth."}
         ]},
      d:{label:"Call her so she at least hears it in your voice.",
         reply:`"Oh. Okay." A pause. "I appreciate the call. Can we talk for a sec when you have time? I want to understand what happened." Her voice is steady.`,
         who:"Dana",
         happened:`A call carried your tone and let her respond right away. It was a strong, humane choice. If she had been across the room, in person would have been even warmer, but voice did real work here.`,
         why:`Phone is a <b>rich channel</b>. She heard care in your voice and could react in the moment. The only thing it missed was your face.`,
         concept:`When you cannot be face to face, voice is the next best thing for sensitive news. Far better than text.`,
         inds:[
           {n:"Right richness for the weight", s:"strong", r:"Voice carries tone and care for hard news."},

/* =========================================================================
   PERSISTENCE (this browser only, cleared when the tab closes)
   ========================================================================= */
function save(){
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function restore(){
  try {
    const raw = sessionStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || s.version !== CONFIG.VERSION) return false;
    Object.assign(state, s);
    return true;
  } catch(e){ return false; }
}

/* =========================================================================
   IDENTITY (scrambled locally) AND NETWORK
   ========================================================================= */
function normalizeId(raw){
  const s = String(raw || "").trim().toLowerCase();
  const digits = s.replace(/\D/g, "");
  if(digits.length === 8) return digits;
  return s.split("@")[0].replace(/\s+/g, "");
}
async function sha256Hex(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function scramble(netid){
  return sha256Hex(CONFIG.SALT1 + "|" + netid);
}
async function post(payload, timeoutMs){
  if(!CONFIG.ENDPOINT || CONFIG.ENDPOINT.indexOf("http") !== 0) return { ok:false, error:"no_endpoint" };
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 25000);
  try {
    const res = await fetch(CONFIG.ENDPOINT, { method:"POST", body: JSON.stringify(payload), signal: ctrl.signal });
    const text = await res.text();
    try { return JSON.parse(text); } catch(e){ return { ok:false, error:"bad_response" }; }
  } catch(e) {
    return { ok:false, error: (e && e.name === "AbortError") ? "timeout" : "network" };
  } finally { clearTimeout(t); }
}
function basePayload(){
  return { h1: state.h1, section: state.section, activity: CONFIG.ACTIVITY, code: state.code || "", clientVersion: CONFIG.VERSION };
}
function pingStart(){
  const p = basePayload(); p.action = "start";
  post(p, 15000).then(r => { if(r && r.ok && r.recordId) { state.recordId = r.recordId; save(); } });
}

/* =========================================================================
   SCORING
   ========================================================================= */
function checkStatuses(){
  return CHECK.map((m, i) => {
    const id = state.answers[i];
    const o = id ? m.options.find(x => x.id === id) : null;
    return o ? o.s : null;
  });
}
function score(){
  return checkStatuses().reduce((sum, s) => sum + (s ? CONFIG.POINTS[s] : 0), 0);
}
const MAX_SCORE = TOTAL_CHECK * CONFIG.POINTS.strong;

/* deterministic shuffle so a reload keeps the same option order for this student */
function seededOrder(seedText){
  let seed = 0;
  for(let i=0;i<seedText.length;i++){ seed = (seed * 31 + seedText.charCodeAt(i)) >>> 0; }
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  return CHECK.map(m => {
    const idx = m.options.map((_, i) => i);
    for(let i=idx.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx;
  });
}

/* =========================================================================
   RENDER
   ========================================================================= */
function progressBar(phaseClass, label, total, currentIdx){
  let dots = "";
  for(let i=0;i<total;i++){
    let cls = "dot";
    if(i < currentIdx) cls += " done";
    else if(i === currentIdx) cls += " on";
    dots += `<span class="${cls}"></span>`;
  }
  return `<div class="progress">
    <span class="phase ${phaseClass}">${label}</span>
    <span class="dots">${dots}</span>
    <span class="step-label">Step ${currentIdx+1} of ${total}</span>
  </div>`;
}
function whoStrip(){
  if(!state.section) return "";
  const sec = CONFIG.SECTIONS[state.section] || { label: state.section };
  const rid = state.recordId ? `Record ${shortId(state.recordId)}` : (state.h1 ? `Record B-${shortId(state.h1)}` : "");
  return `<div class="who-strip"><span>${sec.label} · NetID ending in <b>${state.netidTail}</b></span><span>${rid}</span></div>`;
}
function shortId(h){ return h ? h.slice(0,6).toUpperCase() : ""; }

function render(){
  window.scrollTo({top:0, behavior:"auto"});
  save();
  if(state.screen === "intro") return renderIntro();
  if(state.screen === "signin") return renderSignin();
  if(state.screen === "learn") return renderLearn();
  if(state.screen === "practice") return renderPractice();
  if(state.screen === "read") return renderRead();
  if(state.screen === "checkintro") return renderCheckIntro();
  if(state.screen === "check") return renderCheck();
  if(state.screen === "result") return renderResult();
}

async function submitSignin(){
  const err = document.getElementById("err");
  const raw = document.getElementById("netid").value;
  const id = normalizeId(raw);
  const code = normalizeCode(document.getElementById("code").value);
  if(!state.section){ err.textContent = "Pick your section first."; return; }
  if(code.length < 4){ err.textContent = "Type the class code first. Professor Calafiore says it at the start of class."; return; }
  if(!/^\d{8}$/.test(id)){ err.textContent = "That does not look like an 8 digit NetID. Check it and try again."; return; }
  if(!state.confirmId || state.confirmId !== id){
    state.confirmId = id;
    err.innerHTML = "";
    const box = document.getElementById("confirmBox");
    box.innerHTML = `<div class="block b-clay" style="margin-top:14px"><h3>Is this right?</h3><p>NetID <b style="font-size:22px; letter-spacing:2px">${id.slice(0,4)} ${id.slice(4)}</b> · ${CONFIG.SECTIONS[state.section].label}</p><div class="btn-row"><button class="btn" onclick="submitSignin()">Yes, that is me →</button><button class="btn ghost" onclick="editId()">Let me fix it</button></div></div>`;
    document.getElementById("signinBtn").style.display = "none";
    return;
  }
  const btn = document.querySelector("#confirmBox .btn") || document.getElementById("signinBtn");
  btn.disabled = true; btn.textContent = "Checking the class code…";
  err.textContent = "";
  try {
    state.h1 = await scramble(id);
  } catch(e) {
    err.textContent = "Your browser could not scramble the ID. Open this page in Chrome, Safari, or Edge and try again.";
    btn.disabled = false; btn.textContent = "Yes, that is me →";
    return;
  }
  state.code = code;
  // the collector checks the class code before anyone starts
  const p = basePayload(); p.action = "start";
  const r = await post(p, 30000);
  if(!r || !r.ok){
    const why = {
      bad_code: "That class code is not right. Check the board and type it again.",
      window_closed: "Class is not open right now, so the activity cannot be recorded. Ask Professor Calafiore.",
      no_endpoint: "Recording is switched off on this copy of the page.",
      timeout: "The collector did not answer. Check the Wi-Fi and press the button again.",
      network: "Could not reach the collector. Check the Wi-Fi and press the button again."
    };
    err.textContent = why[(r && r.error) || "network"] || ("Something went wrong: " + ((r && r.error) || "unknown") + ". Try again.");
    btn.disabled = false; btn.textContent = "Yes, that is me →";
    state.h1 = null; state.code = null;
    return;
  }
  state.recordId = r.recordId || null;
  state.netidTail = id.slice(-2);
  state.typedId = ""; state.typedCode = ""; state.confirmId = null;
  state.startedAt = new Date().toISOString();
  state.checkOrder = seededOrder(state.h1);
  state.screen = "learn"; state.learnStep = 0;
  render();
}

  render();
}

/* a gentle, non graded tendency read of the practice picks */
function tendencyRead(){
  const reach = [
    {a:2,b:0,c:0,d:2},
    {a:2,b:0,c:2,d:0},
    {a:0,b:2,c:0,d:1},
    {a:0,b:1,c:2,d:2},
    {a:0,b:0,c:1,d:2}
  ];
  let total = 0, counted = 0;
  state.picks.forEach((p,i)=>{ if(p){ total += reach[i][p]; counted++; } });
  if(counted===0) return "You moved through the week without locking in choices, which is fine. The pattern to notice is simply this: the right channel changes with the message in front of you.";
  const avg = total/counted;
  if(avg >= 1.4) return "You lean toward <b>richer channels</b>. That instinct is a real strength when a message is personal, emotional, or easy to misread. Your growth edge is the opposite reflex: noticing the moments when a quick message or a short email would actually serve people better, and resisting the urge to over deliver.";
  if(avg <= 0.6) return "You lean toward <b>lean, efficient channels</b>. That instinct keeps you fast and keeps a clean record, which matters more than people realize. Your growth edge is sensing the moments that ask for more of you: the heavy news, the tense thread, the conversation that needs a voice and a face.";
  return "Your choices moved <b>up and down the ladder</b> with the situation rather than defaulting to one channel. That flexibility is the whole skill. The work from here is sharpening the judgment call in the genuinely mixed moments, where a message needs both a human touch and a written record.";
}

function firstUnanswered(){ const i = state.answers.findIndex(a => !a); return i < 0 ? TOTAL_CHECK-1 : i; }

function renderCheck(){
  const idx = state.checkStep;
  const m = CHECK[idx];
  const order = (state.checkOrder && state.checkOrder[idx]) || m.options.map((_, i) => i);
  const answered = state.answers[idx];
  const letters = ["a","b","c","d"];

  let optionsHTML = "";
  order.forEach((optIndex, pos) => {
    const o = m.options[optIndex];
    const letter = letters[pos];
    const chosen = answered === o.id;
    optionsHTML += `
      <button class="opt ${letter} ${chosen?'chosen':''}" ${answered?'disabled':''} onclick="answer('${o.id}')">
        <span class="opt-badge ${letter}">${letter.toUpperCase()}</span>
        <span class="opt-text">${o.label}</span>
      </button>`;
  });

  let reactionHTML = "";
  if(answered){
    const o = m.options.find(x => x.id === answered);
    const label = o.s==="strong" ? "Strong fit" : o.s==="partial" ? "Partial fit" : "Poor fit";
    const last = idx === TOTAL_CHECK-1;
    reactionHTML = `
      <div class="reply-bubble screen">
        <span class="who">How it played out</span>
        <span class="text">${o.reply}</span>
      </div>
      <div class="block b-why"><h3>Why</h3><p>${o.why}</p></div>
      <div class="ind" style="margin-bottom:6px"><div class="ind-head"><span class="ind-name">Your answer</span><span class="ind-status ${o.s}">${label} · ${CONFIG.POINTS[o.s]} of ${CONFIG.POINTS.strong}</span></div></div>
      <div class="btn-row">
        ${last
          ? `<button class="btn" onclick="finish()">Finish and record my result →</button>`
          : `<button class="btn" onclick="nextCheck()">Next moment →</button>`}
      </div>`;
  }

  app.innerHTML = `
  <div class="screen">
    ${whoStrip()}
    ${progressBar("check","The Check · scored",TOTAL_CHECK,idx)}
    <div class="card">
      <span class="situation-tag">${m.tag}</span>
      <div class="msg-bubble">
        <span class="who">${m.who}</span>
        <span class="text">${m.setup}</span>
      </div>
      <p class="q-prompt">${m.q}</p>
      ${answered ? "" : `<p class="mini" style="margin:6px 0 0">Your first click is your answer.</p>`}
      <div class="options">${optionsHTML}</div>
      ${reactionHTML}
    </div>
  </div>`;
}
function answer(id){
  const i = state.checkStep;
  if(state.answers[i]) return;          // already locked
  state.answers[i] = id;
  render();
}
function nextCheck(){ if(state.checkStep<TOTAL_CHECK-1){state.checkStep++; render();} }

async function finish(){
  state.screen = "result";
  state.submitError = null;
  render();
  await submitFinal();
}
async function submitFinal(){
  if(state.submitted && state.submitted.ok) { render(); return; }
  const p = basePayload();
  p.action = "submit";
  p.startedAt = state.startedAt;
  p.score = score();
  p.maxScore = MAX_SCORE;
  p.practicePicks = state.picks;
  p.practiceExplored = state.explored.map(x => x.length);
  p.checkAnswers = state.answers;
  p.checkStatuses = checkStatuses();
  const r = await post(p, 30000);
  if(r && r.ok){ state.submitted = r; state.recordId = r.recordId || state.recordId; state.submitError = null; }
  else { state.submitError = (r && r.error) || "network"; }
  render();
}

function renderResult(){
  const sc = score();
  const statuses = checkStatuses();
  let rows = "";
  CHECK.forEach((m, i) => {
    const id = state.answers[i];
    const o = id ? m.options.find(x => x.id === id) : null;
    const label = o ? o.label : "No answer";
    const s = statuses[i];
    const tag = s ? `<span class="ind-status ${s}" style="margin-left:8px">${s==="strong"?"Strong":s==="partial"?"Partial":"Poor"} · ${CONFIG.POINTS[s]}</span>` : "";
    rows += `
      <div class="choice-row">
        <span class="num clay">${i+1}</span>
        <div>
          <div class="sit">${m.tag}</div>
          <div class="pick">${label} ${tag}</div>
        </div>
      </div>`;
  });

  let statusHTML = "";
  if(state.submitted && state.submitted.ok){
    const when = state.submitted.submittedAt ? new Date(state.submitted.submittedAt) : new Date();
    const t = when.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    const again = state.submitted.already ? ` A result for this NetID was already on file, so the first one stands (${state.submitted.score} of ${state.submitted.maxScore}).` : "";
    statusHTML = `<div class="status-line ok">✅ <span><b>Recorded</b> at ${t} for ${CONFIG.SECTIONS[state.section]?CONFIG.SECTIONS[state.section].label:state.section}.${again}</span></div>`;
  } else if(state.submitError){
    const msgs = {
      window_closed: "Class has ended for this activity, so this result was not recorded.",
      bad_code: "The class code no longer matches, so this result was not recorded.",
      no_endpoint: "Recording is switched off on this copy of the page.",
      timeout: "The connection timed out.",
      network: "The connection failed.",
      bad_response: "The collector answered in an unexpected way.",
      bad_id: "The scrambled ID was rejected.",
      bad_section: "The section was rejected."
    };
    const m = msgs[state.submitError] || ("Error: " + state.submitError);
    const retry = (state.submitError === "window_closed" || state.submitError === "no_endpoint") ? "" : `<button class="btn" onclick="submitFinal()">Try to record again</button>`;
    statusHTML = `<div class="status-line bad">⚠️ <span><b>Not recorded yet.</b> ${m}</span></div>
      <div class="btn-row">${retry}</div>
      <p class="mini"><b>If it will not record:</b> take a screenshot of this whole screen and show it to Professor Calafiore before you leave. The record ID below is your proof.</p>`;
  } else {
    statusHTML = `<div class="status-line wait">⏳ <span>Recording your result…</span></div>`;
  }

  app.innerHTML = `
  <div class="screen">
    ${whoStrip()}
    <div class="progress"><span class="phase check">Result</span><span class="step-label">Your week is done</span></div>
    <div class="card stagger">
      <span class="kicker">The Check</span>
      <h2>Your score.</h2>
      <div class="score-hero"><span class="score-num">${sc}</span><span class="score-of">out of ${MAX_SCORE}</span></div>
      ${statusHTML}
      <div class="profile" style="margin-top:20px">
        <h3>Your record ID</h3>
        <div class="record-id">${state.recordId ? shortId(state.recordId) : ("B-" + shortId(state.h1))}</div>
        <p class="mini" style="margin-bottom:0">Screenshot this screen for your own records. 📸</p>
      </div>
      <h3 style="margin-top:24px">The five moments of The Check</h3>
      ${rows}
      <div class="block b-concept" style="margin-top:20px">
        <h3>The one thing to remember</h3>
        <p>The richest channel is not the best channel. The <b>right</b> channel is the one that fits the message. Match it to the weight, the risk of being misread, and whether it needs to be remembered.</p>
      </div>
      <p class="mini center" style="margin-top:18px">You have reached the end of the Unit 1 simulation. Nicely done.</p>
    </div>
  </div>`;
}

/* boot */
(function(){
  const restored = restore();
  if(!restored){ state.version = CONFIG.VERSION; }
  if(restored && state.screen === "result" && !(state.submitted && state.submitted.ok)){
    render(); submitFinal(); return;
  }
  render();
})();
</script>
</body>
</html>
